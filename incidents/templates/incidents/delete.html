{% extends "accounts/base.html" %}
{% block title %}Delete SOS report{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>Delete SOS report #{{ report.pk }}?</h1>
  <p>This permanently removes the report.</p>
  <form method="post" class="fields">
    {% csrf_token %}
    <button type="submit">Delete report</button>
    <a href="{% url 'incidents:detail' report.pk %}">Cancel</a>
  </form>
</section>
{% endblock %}
