{% extends "accounts/base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<section class="card form-card">
  <h1>Edit profile</h1>
  <form method="post" class="fields">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Save changes</button>
    <a href="{% url 'profile' %}">Cancel</a>
  </form>
</section>
{% endblock %}
